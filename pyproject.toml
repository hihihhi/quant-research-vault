[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
files = [
  "fetch.py", "sync.py", "search_mcp.py", "process.py", "run.py", "research.py",
  "master.py", "install.py", "list_pending.py", "mark_analyzed.py", "test_repo.py",
  "scripts/generate-copilot-context.py", "test_quality.py",
]